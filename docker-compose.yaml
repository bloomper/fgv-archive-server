name: fgv-archive-server

services:
  archive-mysql:
    image: 'mysql:8.4'
    restart: unless-stopped
    command: --log-error=/var/log/mysql/error.log
    environment:
      MYSQL_HOST: localhost
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_USER: ${MYSQL_ROOT_USER}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/MYSQL_ROOT_PASSWORD
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/MYSQL_USER_PASSWORD
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "127.0.0.1:3311:3306"
    volumes:
      - ./.docker/mysql/data:/var/lib/mysql
      - ./.docker/mysql/log:/var/log/mysql
    secrets:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_USER_PASSWORD

  # The API, with the worker that reads files and renders previews running inside it (the local profile)
  archive-api:
    image: 'bloomper/fgv-archive-server:develop'
    #platform: linux/arm64
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://archive-mysql/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 9000
      LOGGING_FILE_PATH: /data/log_data
      SERVER_REQUEST_HEADER_FORWARDED_STRATEGY: web-server
      # Bind straight to the properties, which the local profile sets to localhost values
      ARCHIVE_KEYCLOAK_URL: http://keycloak-server:8080/auth
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      MAIL_FROM: noreply@fgv.local.nu
      API_WEB_URL: ${API_WEB_URL}
      API_KEYCLOAK_REALM: ${API_KEYCLOAK_REALM}
      API_STORAGE_ROOT: /data/archive
      API_IMPORTS_ROOT: /data/imports
      API_SPEXIPEDIA_GRAPHQL_URL: http://spexipedia-api:8080/api/graphql
      SPEXIPEDIA_WEB_URL: ${SPEXIPEDIA_WEB_URL:-https://spexipedia.fgv.local.nu:8443}
      API_IMPORT_SAMPLE_DATA: ${API_IMPORT_SAMPLE_DATA:-false}
      API_SAMPLE_DATA_SIZE: ${API_SAMPLE_DATA_SIZE:-small}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak-server:8080/auth/realms/fgv/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.fgv.local.nu:8443/auth/realms/fgv
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000;printf \"GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3;grep -q \"^HTTP/1.1 200\" <&3" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      archive-mysql:
        condition: service_healthy
    volumes:
      - ${API_DATA:-./.docker/api}/log_data:/data/log_data
      - ${API_DATA:-./.docker/api}/archive:/data/archive
      - ${API_DATA:-./.docker/api}/imports:/data/imports
    networks:
      - default
      - fgv
    secrets:
      - source: MYSQL_USER_PASSWORD
        target: MYSQL_API_USER_PASSWORD
      - API_KEYCLOAK_SERVICE_CLIENT_SECRET

networks:
  fgv:
    name: fgv-local
    external: true

secrets:
  MYSQL_ROOT_PASSWORD:
    file: .docker/secrets/MYSQL_ROOT_PASSWORD
  MYSQL_USER_PASSWORD:
    file: .docker/secrets/MYSQL_USER_PASSWORD
  API_KEYCLOAK_SERVICE_CLIENT_SECRET:
    file: .docker/secrets/API_KEYCLOAK_SERVICE_CLIENT_SECRET
